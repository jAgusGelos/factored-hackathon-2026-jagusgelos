<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Video Teleprompter</title>
<style>
  :root {
    --bg: #05090f;
    --text: #e8eef6;
    --muted: #7d8da3;
    --accent: #4c8dff;
    --warn: #f0b429;
    --size: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  header { position: fixed; inset: 0 0 auto 0; display: flex; gap: 16px; align-items: baseline;
    padding: 14px 28px; color: var(--muted); font-size: 18px; z-index: 2; background: linear-gradient(var(--bg) 70%, transparent); }
  header .take { color: var(--accent); font-weight: 800; font-size: 28px; letter-spacing: .04em; }
  header .place { color: var(--text); }
  header .spacer { flex: 1; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #scroller { padding: 30vh 8vw 60vh; }
  #scroller.mirrored { transform: scaleX(-1); }
  .line { font-size: var(--size); line-height: 1.35; font-weight: 600; max-width: 22ch; margin: 0 auto; }
  .note { margin: 32px auto 0; max-width: 40ch; font-size: 22px; color: var(--warn); border-left: 4px solid var(--warn); padding-left: 14px; }
  .eyeline { position: fixed; left: 0; right: 0; top: 30vh; border-top: 1px dashed rgba(76, 141, 255, .35); pointer-events: none; }
  #countdown { position: fixed; inset: 0; display: none; place-items: center; font-size: 30vh; font-weight: 800;
    color: var(--accent); background: rgba(5, 9, 15, .92); z-index: 3; }
  #countdown.on { display: grid; }
  footer { position: fixed; inset: auto 0 0 0; padding: 10px 28px; color: var(--muted); font-size: 15px; background: linear-gradient(transparent, var(--bg) 40%); }
  kbd { border: 1px solid #2a3a52; border-radius: 4px; padding: 1px 6px; color: var(--text); }
  .progress { height: 3px; background: #142236; margin-top: 6px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; }
</style>
</head>
<body>
<header>
  <span class="take" id="take"></span>
  <span class="place" id="place"></span>
  <span id="target"></span>
  <span class="spacer"></span>
  <span id="pos"></span>
  <span id="state"></span>
</header>
<div id="stage"><div id="scroller"><div class="line" id="line"></div><div class="note" id="note" hidden></div></div></div>
<div class="eyeline"></div>
<div id="countdown"></div>
<footer>
  <kbd>→</kbd>/<kbd>←</kbd> next / previous take &nbsp; <kbd>space</kbd> 3-2-1 then auto-scroll (again: stop)
  &nbsp; <kbd>↑</kbd>/<kbd>↓</kbd> scroll speed &nbsp; <kbd>+</kbd>/<kbd>-</kbd> text size &nbsp; <kbd>m</kbd> mirror
  &nbsp; <kbd>r</kbd> back to top &nbsp; <kbd>f</kbd> fullscreen
  <div class="progress"><div id="bar"></div></div>
</footer>
<script id="takes" type="application/json">{"placements":{"presenter":"Full presenter: cut out, waist-up, one third of the frame, kinetic type beside you","bubble":"Picture-in-picture bubble over the app footage: head and shoulders","voice":"Voice only: the app takes the whole frame (still record on camera, it may be used)","diagram":"Beside the animated diagram: waist-up, you may point to your side"},"lines":[{"id":"cold1","take":"T01","scene":"cold","placement":"presenter","text":"It's late. You open your bank app, and there it is. A charge you don't recognize.","duration":5.16},{"id":"cold2","take":"T02","scene":"cold","placement":"presenter","text":"You report it. And then, you wait.","duration":2.664},{"id":"cold3","take":"T03","scene":"cold","placement":"presenter","text":"At this bank, the median wait for a first answer is thirty-seven hours.","duration":4.632},{"id":"reveal1","take":"T04","scene":"reveal","placement":"presenter","text":"I wanted that answer in seconds. And I wanted it to be right.","duration":3.576},{"id":"reveal2","take":"T05","scene":"reveal","placement":"presenter","text":"So I built the LATAM Bank Dispute Agent.","duration":2.76},{"id":"m1a","take":"T06","scene":"m1","placement":"bubble","text":"The customer writes it in their own words. The agent finds the exact charge in their history, and asks: is this the one?","duration":7.872},{"id":"m1b","take":"T07","scene":"m1","placement":"bubble","text":"One short explanation, and it's done. A provisional credit, the card blocked, a reference number. Every fact is checked against the record.","duration":8.592},{"id":"m2a","take":"T08","scene":"m2","placement":"bubble","text":"Charged twice for one taxi? It doesn't guess. It shows the customer their own charges, and lets them pick.","duration":6.72},{"id":"m2b","take":"T09","scene":"m2","placement":"bubble","text":"Then it finds the twin in the data, and refunds one. Only one.","duration":4.296},{"id":"m3a","take":"T10","scene":"m3","placement":"bubble","text":"And when a charge should not be paid automatically, it knows not to act.","duration":4.392},{"id":"m3b","take":"T11","scene":"m3","placement":"voice","text":"It asks the questions an advisor would call back for, and blocks the card to keep the customer safe. Then a person gets the full case file: verified facts, the customer's story, and what is still open.","duration":12.6},{"id":"m3c","take":"T12","scene":"m3","placement":"voice","text":"In Spanish, or in Portuguese.","duration":2.472},{"id":"how1","take":"T13","scene":"how","placement":"diagram","text":"Why would a bank trust it? Because the model only reads. The rules and permissions live in code. And every fact is checked against the customer's own ledger.","duration":9.6},{"id":"how2","take":"T14","scene":"how","placement":"diagram","text":"I built it on a focused slice of the data: one month of transactions. A dispute only needs recent history, and the live app never touches the raw data.","duration":9.96},{"id":"how3","take":"T15","scene":"how","placement":"diagram","text":"I tested it on forty-eight new conversations, with the real model. It resolved all eighteen it should, with zero unsafe outcomes.","duration":8.88},{"id":"close1","take":"T16","scene":"close","placement":"presenter","text":"Answers in seconds for the cases it should resolve. A person for the ones it shouldn't.","duration":5.256},{"id":"close2","take":"T17","scene":"close","placement":"presenter","text":"The LATAM Bank Dispute Agent. Try it live. The link is below.","duration":4.8}]}</script>
<script>
  const data = JSON.parse(document.getElementById("takes").textContent);
  const takes = data.lines;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const scroller = $("scroller");
  const state = { index: 0, scrolling: false, speed: 60, size: 64, mirrored: false, last: 0 };

  function restore() {
    try {
      Object.assign(state, JSON.parse(localStorage.getItem("teleprompter") || "{}"), { scrolling: false });
    } catch {
      // storage can be unavailable on file:// in some browsers; defaults are fine
    }
  }

  function save() {
    try {
      const { index, speed, size, mirrored } = state;
      localStorage.setItem("teleprompter", JSON.stringify({ index, speed, size, mirrored }));
    } catch {
      // same as restore()
    }
  }

  function render() {
    const take = takes[state.index];
    $("take").textContent = take.take;
    $("place").textContent = data.placements[take.placement] || take.placement;
    $("target").textContent = `~${Math.round(take.duration)} s`;
    $("pos").textContent = `${state.index + 1} / ${takes.length}`;
    $("line").textContent = take.text;
    $("note").hidden = !take.note;
    $("note").textContent = take.note || "";
    $("bar").style.width = `${((state.index + 1) / takes.length) * 100}%`;
    document.documentElement.style.setProperty("--size", `${state.size}px`);
    scroller.classList.toggle("mirrored", state.mirrored);
    stage.scrollTop = 0;
    $("state").textContent = state.scrolling ? `scrolling ${state.speed} px/s` : `speed ${state.speed} px/s`;
    save();
  }

  function go(delta) {
    state.scrolling = false;
    state.index = Math.min(takes.length - 1, Math.max(0, state.index + delta));
    render();
  }

  function countdownThenScroll() {
    const box = $("countdown");
    let n = 3;
    box.textContent = n;
    box.classList.add("on");
    const tick = setInterval(() => {
      n -= 1;
      if (n > 0) {
        box.textContent = n;
        return;
      }
      clearInterval(tick);
      box.classList.remove("on");
      state.scrolling = true;
      state.last = performance.now();
      render();
      requestAnimationFrame(step);
    }, 1000);
  }

  function step(now) {
    if (!state.scrolling) return;
    stage.scrollTop += (state.speed * (now - state.last)) / 1000;
    state.last = now;
    requestAnimationFrame(step);
  }

  const keys = {
    ArrowRight: () => go(1), PageDown: () => go(1),
    ArrowLeft: () => go(-1), PageUp: () => go(-1),
    " ": () => (state.scrolling ? ((state.scrolling = false), render()) : countdownThenScroll()),
    ArrowUp: () => { state.speed += 10; render(); },
    ArrowDown: () => { state.speed = Math.max(10, state.speed - 10); render(); },
    "+": () => { state.size += 6; render(); }, "=": () => { state.size += 6; render(); },
    "-": () => { state.size = Math.max(28, state.size - 6); render(); },
    m: () => { state.mirrored = !state.mirrored; render(); },
    r: () => { state.scrolling = false; render(); },
    f: () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()),
  };
  document.addEventListener("keydown", (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const action = keys[event.key];
    if (!action) return;
    event.preventDefault();
    action();
  });

  restore();
  state.index = Math.min(state.index, takes.length - 1);
  render();
</script>
</body>
</html>

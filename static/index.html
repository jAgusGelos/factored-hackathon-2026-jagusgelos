<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LATAM Bank — Ingresar</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-screen">
      <div class="bank-mark">LATAM Bank</div>
      <h2>Reportar un cargo no reconocido</h2>
      <p class="demo-notice">
        Este es un ambiente de demostración. El inicio de sesión usa credenciales de prueba,
        no un sistema de identidad real de producción.
      </p>
      <button type="button" class="btn-secondary btn-autofill" id="autofill-btn" hidden>
        Autocompletar
      </button>
      <form id="login-form" novalidate>
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required />

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />

        <button type="submit" class="btn-primary">Ingresar</button>
        <p class="error-message" id="login-error" role="alert"></p>
      </form>
    </div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>

# Render.com deployment config for the Transaction Dispute AI Agent (AD-7
# fallback, chosen 2026-10-02 instead of Fly.io: no card on file).
#
# Uses a PREBUILT image (runtime: image), not Render's own git-triggered
# Dockerfile build: data/fixture.duckdb, data/demo_users.json and
# data/classifier.joblib are gitignored by design (AD-2, never commit dataset
# artifacts), so a build from a fresh git checkout has no access to them and
# fails at the Dockerfile's COPY step. The image is built locally (where those
# files exist) and pushed to a PRIVATE Docker Hub repository, for the same
# reason; Render pulls it with a registry credential named `dockerhub`
# (Docker Hub user + a read-only access token, created in the Render dashboard).
#
# Free plan: no persistent disk and a cold start after ~15 min idle. data/app.db
# (sessions and cases) is lost on every restart or redeploy, so AD-4's
# restart-persistence claim does NOT hold on this deployment (disclosed in
# DEPLOY.md and the README); the starter plan plus a `disk:` at /app/data would
# restore it with no code change.

services:
  - type: web
    name: dispute-agent-hackathon
    runtime: image
    image:
      url: docker.io/agustingelos1/factored-hackaton:latest
      creds:
        fromRegistryCreds:
          name: dockerhub
    plan: free
    region: virginia  # closer to the 3 LATAM countries in scope than Render's Oregon region
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # set manually in the Render dashboard, never in this file or in git
      - key: SESSION_TTL_HOURS
        value: "4"
      - key: SHOW_DEMO_CREDENTIALS
        value: "1"  # login-screen autofill of the synthetic demo personas; "0" hides it
      - key: PORT
        value: "8000"  # must match the image's listening port (Render defaults to 10000 otherwise)
      # No AWS_* vars are set: the deployed app has zero runtime AWS dependency
      # by design (AD-2).
